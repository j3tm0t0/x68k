# /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
# X68000 Z (MuTERM, 38400bps 上限, ハードフロー制御なし) からのシリアルログイン用
#   sudo install -D -m644 serial-getty-override.conf /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart serial-getty@ttyS0
[Service]
Environment=TERM=ansi
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear 38400,19200,9600 - ${TERM}
