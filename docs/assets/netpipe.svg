<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-label="Z の SLIP を Pico W が SCSI 越しに受け取り、Wi-Fi に出す" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="np-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker>
  </defs>
  <rect width="760" height="356" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Z の SLIP を Pico W が SCSI 越しに受け取り、Wi-Fi に出す</text>
  <rect x="24" y="52" width="220" height="280" rx="8" fill="#efefec" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="134" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">X68000 Z (Human68k)</text>
  <g fill="none" stroke="#9a9a92" stroke-width="1.25">
    <rect x="40" y="92" width="188" height="40" rx="8"/>
    <rect x="40" y="148" width="188" height="40" rx="8"/>
    <rect x="40" y="204" width="188" height="40" rx="8"/>
    <rect x="40" y="260" width="188" height="40" rx="8"/>
    <line x1="134" y1="132" x2="134" y2="148"/>
    <line x1="134" y1="188" x2="134" y2="204"/>
    <line x1="134" y1="244" x2="134" y2="260"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <text x="134" y="116">rcmd.x / ping.x</text>
    <text x="134" y="172">xip.x (TCP/IP)</text>
    <text x="134" y="228">slip.sys (/dev/ep0)</text>
    <text x="134" y="284">slipd.x -z</text>
  </g>
  <rect x="304" y="244" width="180" height="72" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
  <text x="394" y="268" text-anchor="middle" font-weight="600" fill="#1f1f1f">Pico W</text>
  <text x="394" y="286" text-anchor="middle" font-size="11.5" fill="#6b6b6b">x68kzremotedrv</text>
  <text x="394" y="302" text-anchor="middle" font-size="11.5" fill="#6b6b6b">+ netpipe</text>
  <rect x="560" y="92" width="176" height="72" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="648" y="116" text-anchor="middle" font-weight="600" fill="#1f1f1f">LAN (Wi-Fi)</text>
  <text x="648" y="134" text-anchor="middle" font-size="11.5" fill="#6b6b6b">Mac、ルーター</text>
  <text x="648" y="150" text-anchor="middle" font-size="11.5" fill="#6b6b6b">→ インターネット</text>
  <rect x="560" y="244" width="176" height="72" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="648" y="268" text-anchor="middle" font-weight="600" fill="#1f1f1f">Raspberry Pi</text>
  <text x="648" y="286" text-anchor="middle" font-size="11.5" fill="#6b6b6b">slipudp.py → sl0</text>
  <text x="648" y="302" text-anchor="middle" font-size="11.5" fill="#6b6b6b">NAT</text>
  <g fill="none" stroke="#9a9a92" stroke-width="1.25">
    <path d="M228 280H304" marker-start="url(#np-arrow)" marker-end="url(#np-arrow)"/>
    <path d="M394 244V128H560" marker-start="url(#np-arrow)" marker-end="url(#np-arrow)" stroke-dasharray="4 4"/>
    <path d="M484 280H560" marker-start="url(#np-arrow)" marker-end="url(#np-arrow)"/>
    <path d="M648 244V164" marker-start="url(#np-arrow)" marker-end="url(#np-arrow)"/>
  </g>
  <g font-size="11.5" fill="#6b6b6b">
    <text x="266" y="270" text-anchor="middle">SCSI ID 6</text>
    <text x="477" y="118" text-anchor="middle">ブリッジ (第 5 回)</text>
    <text x="522" y="270" text-anchor="middle">UDP</text>
    <text x="658" y="208">NAT で外へ</text>
  </g>
</svg>
