# harness/picosim/docker/Dockerfile が linux/amd64 でビルドできるかだけを確かめる (どこにも push しない)
name: Docker harness image
on:
  push:
    branches: [main]
    paths: [harness/picosim/docker/**, .github/workflows/docker.yml]
  pull_request:
    paths: [harness/picosim/docker/**, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: docker build (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: harness/picosim/docker
          platforms: linux/amd64
          push: false
          tags: x68k-picoharness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
