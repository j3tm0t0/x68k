[package]
name = "zmux"
version = "0.1.0"
edition = "2021"
description = "Multiplex an X68000's RS-232C line (console, TSP sockets, sessions) on a Raspberry Pi"
license = "MIT"

[[bin]]
name = "zmux"
path = "src/main.rs"

[dependencies]
libc = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
vt100 = "0.15"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
